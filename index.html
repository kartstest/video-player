<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch Video Loader</title>

<style>

body{
font-family:Arial;
background:#000;
color:#fff;
margin:0;
text-align:center;
}

header{
background:#111;
padding:15px;
}

.controls{
max-width:900px;
margin:20px auto;
display:flex;
flex-direction:column;
gap:12px;
}

textarea{
width:100%;
height:180px;
padding:12px;
font-size:14px;
background:#222;
color:#fff;
border:1px solid #555;
border-radius:5px;
}

input{
width:120px;
padding:10px;
font-size:16px;
background:#222;
color:#fff;
border:1px solid #555;
border-radius:5px;
text-align:center;
}

button{
padding:10px 18px;
font-size:15px;
border:none;
border-radius:5px;
cursor:pointer;
background:#007BFF;
color:#fff;
}

button:hover{
background:#0056b3;
}

.row{
display:flex;
gap:10px;
justify-content:center;
flex-wrap:wrap;
}

#progress{
font-size:16px;
margin-top:5px;
color:#0af;
}

#videoContainer{
max-width:1200px;
margin:25px auto;
}

iframe{
width:100%;
aspect-ratio:16/9;
border:none;
margin-bottom:25px;
}

</style>
</head>

<body>

<header>
<h1>Batch Video Loader</h1>
</header>

<div class="controls">

<textarea id="iframeList" placeholder="Paste iframe embed codes here (one per line)"></textarea>

<div class="row">
<label>Batch Size:</label>
<input type="number" id="batchSize" value="5" min="1">
</div>

<div class="row">
<button onclick="prepareList()">Start List</button>
<button onclick="loadBatch()">Load Next Batch</button>
<button onclick="clearVideos()">Clear Screen</button>
</div>

<div id="progress">Progress: 0 / 0</div>

</div>

<div id="videoContainer"></div>

<script>

let iframeArray = [];
let totalCount = 0;
let loadedCount = 0;

function prepareList(){

const raw = document.getElementById("iframeList").value.trim();

if(!raw){
alert("Paste iframe list first");
return;
}

iframeArray = raw.split("\n").filter(x=>x.trim() !== "");

totalCount = iframeArray.length;
loadedCount = 0;

updateProgress();

alert("Loaded "+totalCount+" videos in list");

}

function loadBatch(){

const batchSize = parseInt(document.getElementById("batchSize").value);
const container = document.getElementById("videoContainer");

if(iframeArray.length === 0){
alert("No more videos in list");
return;
}

let batch = iframeArray.splice(0,batchSize);

batch.forEach(code=>{

const div=document.createElement("div");
div.innerHTML=code;
container.appendChild(div);

loadedCount++;

});

updateProgress();

if(iframeArray.length === 0){
alert("All videos checked");
}

}

function updateProgress(){

document.getElementById("progress").innerText =
"Progress: " + loadedCount + " / " + totalCount;

}

function clearVideos(){

document.getElementById("videoContainer").innerHTML="";

}

</script>

</body>
</html>
