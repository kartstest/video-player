<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #000;
  color: #fff;
  margin: 0;
  text-align: center;
}

header {
  background: #111;
  padding: 12px;
  cursor: pointer;
}

.controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  margin: 30px auto;
  max-width: 600px;
}

.controls input {
  width: 100%;
  max-width: 500px;
  padding: 12px;
  font-size: 16px;
  background: #222;
  color: #fff;
  border: 1px solid #555;
  border-radius: 5px;
}

.button-row {
  display: flex;
  gap: 10px;
}

button {
  padding: 10px 20px;
  font-size: 16px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

button.primary {
  background: #007BFF;
  color: #fff;
}

button.primary:hover {
  background: #0056b3;
}

#videoContainer {
  max-width: 1280px;
  margin: 20px auto;
}

iframe {
  width: 100%;
  aspect-ratio: 16 / 9;
  border: none;
}

a {
  color: #0af;
  display: inline-block;
  margin-top: 15px;
}

#goTopBtn {
  position: fixed;
  bottom: 30px;
  right: 30px;
  display: none;
  background: #007BFF;
  color: #fff;
  border-radius: 50%;
  padding: 12px 15px;
  font-size: 18px;
  cursor: pointer;
}
</style>
</head>

<body>

<header id="homeBtn">
  <h1>Video Player</h1>
</header>

<div class="controls">
  <input id="videoLink" placeholder="Paste iframe embed code here">
  <div class="button-row">
    <button class="primary" onclick="pasteFromClipboard()">📋 Paste</button>
    <button class="primary" onclick="playVideo()">▶ Play</button>
  </div>
</div>

<div id="videoContainer"></div>

<a href="history.html">📜 View History</a>

<button id="goTopBtn">⬆</button>

<script>
const HISTORY_KEY = 'iframeHistory';

const input = document.getElementById('videoLink');
const videoContainer = document.getElementById('videoContainer');
const goTopBtn = document.getElementById('goTopBtn');

/* ---------- Helpers ---------- */
function extractSrc(iframe) {
  const m = iframe.match(/src=["']([^"']+)["']/);
  return m ? m[1] : iframe;
}

/* ---------- Clipboard ---------- */
async function pasteFromClipboard() {
  try {
    input.value = await navigator.clipboard.readText();
  } catch {
    alert('Clipboard access failed');
  }
}

/* ---------- Play Video ---------- */
function playVideo(iframeOverride = null) {
  const iframe = iframeOverride || input.value.trim();

  if (!iframe.startsWith('<iframe')) {
    alert('Paste a valid iframe embed code');
    return;
  }

  videoContainer.innerHTML = iframe;

  const history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
  history.push({
    iframe,
    src: extractSrc(iframe),
    time: Date.now()
  });
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));

  input.value = '';
}

/* ---------- Replay from History ---------- */
const replay = localStorage.getItem('replayIframe');
if (replay) {
  playVideo(replay);
  localStorage.removeItem('replayIframe');
}

/* ---------- UI ---------- */
document.getElementById('homeBtn').onclick = () => {
  videoContainer.innerHTML = '';
  input.value = '';
};

window.addEventListener('scroll', () => {
  goTopBtn.style.display = window.scrollY > 300 ? 'block' : 'none';
});

goTopBtn.onclick = () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
};
</script>

</body>
</html>
