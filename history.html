<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>History</title>

<style>
body {
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 20px;
}

h1 {
  text-align: center;
}

.history-item {
  background: #222;
  padding: 12px;
  margin: 10px 0;
  border-radius: 6px;
  cursor: pointer;
  word-break: break-all;
}

.history-item:hover {
  background: #333;
}

button {
  padding: 8px 16px;
  margin-bottom: 15px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

.clear {
  background: #dc3545;
  color: #fff;
}

.back {
  background: #007BFF;
  color: #fff;
  margin-left: 10px;
}
</style>
</head>

<body>

<h1>History</h1>

<button class="clear" onclick="clearHistory()">Clear All</button>
<button class="back" onclick="goBack()">⬅ Back</button>

<div id="historyContainer"></div>

<script>
const HISTORY_KEY = 'iframeHistory';

function loadHistory() {
  const container = document.getElementById('historyContainer');
  const history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];

  if (!history.length) {
    container.innerHTML = '<p>No history available.</p>';
    return;
  }

  container.innerHTML = '';

  history.reverse().forEach(item => {
    const div = document.createElement('div');
    div.className = 'history-item';
    div.textContent = item.src;

    div.onclick = () => {
      localStorage.setItem('replayIframe', item.iframe);
      window.location.href = 'index.html';
    };

    container.appendChild(div);
  });
}

function clearHistory() {
  if (confirm('Clear entire history?')) {
    localStorage.removeItem(HISTORY_KEY);
    loadHistory();
  }
}

function goBack() {
  window.location.href = 'index.html';
}

window.onload = loadHistory;
</script>

</body>
</html>
